<body>

      loadLayout("headerLayout", "/assets/htmlLayouts/layout_header.html");

  <main id="main" class="main">

    <div class="pagetitle page-header">
      <!-- მარცხენა მხარე -->
      <span>
        <h1>მენიუს დამატება</h1>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Tables</li>
          <li class="breadcrumb-item active">Menus Add</li>
        </ol>
      </span>

    </div>
    <!--მონაცემების დამატების სექცია - დასაწყისი-->

    <div class="card mb-4 shadow-sm">
      
      <div class="card-header bg-warning-light text-white collapsed" data-bs-toggle="collapse" id="menuCreateHeader"
        data-bs-target="#menuCreateCollapse" role="button" aria-expanded="false" aria-controls="menuCreateCollapse"
        style="cursor: pointer;">
        <h6 class="text-center mb-0">მენიუს შექმნა
          <i class="bi bi-chevron-down ms-2 collapse-icon"></i>
        </h6>
      </div>

      <div id="menuCreateCollapse" class="collapse">
        <h6 class="text-center" id="menu-notification"></h6>
        <div class="row g-6">
          <div class="card-body">
            <div class="row g-6">
              <form action=""></form>

              <div class="col-lg-3 col-md-3">
                <label class="form-label">სახელი ქართულად</label>
                <input type="text" id="menu-name-geo" class="form-control bg-light" required="" minlength="2"
                  maxlength="50" pattern="^[ა-ჰ\s]+$" name="menu-name-geo" value="" title="მხოლოდ ქართული ასოები">
              </div>

              <div class="col-lg-3 col-md-3">
                <label class="form-label">სახელი ინგლისურად</label>
                <input type="text" name="menu-name-eng" id="menu-name-eng" class="form-control bg-light" required=""
                  pattern="^[A-Za-z\s]+$" title="მხოლოდ ინგლისური ასოები" value="">
              </div>

              <div class="col-lg-3 col-md-3">
                <label class="form-label"></label>
                <button type="submit" class="btn btn-warning w-100" id="add-menu-header-button"
                  title="დარბაზის დამატება">
                  <i class="bi bi-plus-circle me-1"></i>დამატება
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="card mb-4 shadow-sm">

      <h6 class="text-center" id="selected-menu-notification"></h6>

      <div class="card-header bg-success text-white">
        <h6 class="text-center mb-0">მენიუს არჩევა</h6>
      </div>

      <div class="row g-6">
        <div class="card-body">
          <div class="row g-6">

            <!-- დარბაზის არჩევა -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">მენიუ</label>
              <select name="guest-category" id="selected-menu" class="form-select" required>
                <option value="" disabled selected>აირჩიე დარბაზი</option>
              </select>
            </div>

            <div class="col-lg-3 col-md-3">
              <label class="form-label"></label>
              <button type="button" class="btn btn-warning w-100" id="add-menu-button" title="დარბაზის დამატება">
                <i class="bi bi-plus-circle me-1"></i>არჩევა
              </button>
            </div>

          </div>
        </div>
      </div>


    </div>

    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white">
        <h6 class="text-center mb-0">მენიუს შედგენა</h6>
      </div>
      <h6 class="text-center" id="item-notification"></h6>

      <div class="card-body">
        <div class="row g-6">
          <div class="col-lg-6 col-md-6">
            <label class="form-label">კატეგორია</label>
            <select name="guest-category" id="selected-menu-item" class="form-select" required>
              <option value="" disabled selected>აირჩიე კატეგორია</option>
            </select>
          </div>

          <div class="col-lg-2 col-md-6">
            <label class="form-label">ფასი</label>
            <input type="number" name="price" id="item-price" class="form-control bg-light" required="" value="0">
          </div>
        </div>

        <div class="row g-6">
          <div class="col-lg-3 col-md-6">
            <label class="form-label">ნივთის სახელი ქართ.</label>
            <input type="text" name="item-item-geo" id="item-name-geo" class="form-control bg-light" value="" required>
          </div>
          <div class="col-lg-3 col-md-6">
            <label class="form-label">Item Name</label>
            <input type="text" name="item-item-eng" id="item-name-eng" class="form-control bg-light" value="" required
              title="კატეგორია ინგლისურად">
          </div>
          <div class="col-lg-12 col-md-6">
            <label class="form-label"></label>
            <button type="button" class="btn btn-success w-100" data="menu-item" id="add-button"
              title="დამატება შეკვეთაში">
              <i class="bi bi-plus-circle me-1"></i>დამატება
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-header bg-light">
        <div class="card-header bg-light justify-content-between align-items-center">
          <h6 class="text-center fw-bold" style="font-size: 25px;" id="tableHeaderTitle">მენიუს სახელი</h6>
        </div>
      </div>
      <div class="card-body p-0">
        <table class="table table-bordered table-striped small mb-0">
          <colgroup>
            <col style="width: 40%;">
            <col style="width: 30%;">
            <col style="width: 15%;">
            <col style="width: 15%;">
          </colgroup>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </div>
